name: Format

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - .github/workflows/formatter.yml
      - .editorconfig
      - lc-hax/Scripts/**/*.cs
      - analysers/**/*.cs
      - launcher/**/*.cs

concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions: {}

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  format:
    runs-on: ubuntu-slim
    outputs:
      patched: ${{ steps.patch.outputs.patched }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          show-progress: false
          persist-credentials: false
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.403
          cache: true
          cache-dependency-path: |
            lc-hax/packages.lock.json
            analysers/packages.lock.json
            launcher/packages.lock.json

      - name: Restore dependencies
        run: dotnet restore launcher --locked-mode

      - name: Format scripts
        run: |
          dotnet format lc-hax --no-restore
          dotnet format analysers --no-restore
          dotnet format launcher --no-restore

      - name: Upload format patch
        id: patch
        uses: winstxnhdw/actions/upload-patch@main

  push:
    if: needs.format.outputs.patched
    needs: format
    uses: winstxnhdw/actions/.github/workflows/format-push.yml@main
    secrets:
      token: ${{ secrets.PAT }}
    permissions:
      contents: write
